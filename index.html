<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳士考試資源整合入口</title>
    <style>
        :root {
            /* 採用深邃暗色系與高對比文字 */
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --header-bg: #161b22;
            --card-bg: #0d1117;
            --item-bg: #21262d;
            --primary-color: #58a6ff;
            --primary-hover: #1f6feb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .layout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background-color: var(--header-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .header-text {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            color: var(--primary-color);
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .link-card {
            background-color: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-card:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-color);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(31, 111, 235, 0.3);
        }

        .empty-slot {
            visibility: hidden;
        }

        @media (max-width: 600px) {
            .layout-container {
                padding: 15px;
                gap: 10px;
            }
            .header-text {
                font-size: 18px;
                padding: 12px 8px;
            }
            .link-card {
                font-size: 16px;
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    <h1>記帳士考試資源整合入口</h1>

    <div class="layout-container">
        <div class="header-text">歷屆題目查詢</div>
        <div class="header-text">法規查詢</div>

        <a href="https://wu0205n.github.io/ExamViewer_Bookkeeping/" target="_blank" class="link-card">記帳相關法規概要</a>
        <a href="https://wu0205n.github.io/law_search_Bookkeeping/" target="_blank" class="link-card">記帳相關法規概要</a>

        <a href="https://wu0205n.github.io/ExamViewer_Tax/" target="_blank" class="link-card">稅務相關法規概要</a>
        <a href="https://wu0205n.github.io/Law_Search_Tax/" target="_blank" class="link-card">稅務相關法規概要</a>

        <a href="https://wu0205n.github.io/ExamViewer_Accounting/" target="_blank" class="link-card">會計學概要</a>
        <div class="empty-slot"></div>
    </div>

</body>
</html>
